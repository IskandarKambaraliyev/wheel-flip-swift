name: WheelFlip
options:
  bundleIdPrefix: uz.stiv
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "6MD59J7ZW5"          # Intersoft Tech
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      # Added to the spec: the STRIP_* settings only take effect during post-processing,
      # which a plain `xcodebuild build` skips without this.
      DEPLOYMENT_POSTPROCESSING: YES
      # Added to the spec: keep Xcode from injecting get-task-allow into the installed build.
      # A debuggable app would let any local process borrow its Accessibility grant.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
targets:
  WheelFlip:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: WheelFlip
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "© 2026 Abdulloh"
    entitlements:
      path: Resources/WheelFlip.entitlements
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uz.stiv.wheelflip
    # Shared scheme so `xcodebuild -scheme WheelFlip test` finds the unit tests.
    scheme:
      testTargets:
        - WheelFlipTests
  WheelFlipTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: WheelFlip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
